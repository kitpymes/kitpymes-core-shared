name: ci

# Compila y pasa los tests en cada subida a master y en cada PR.
# Al crear una etiqueta vX.Y.Z, además empaqueta y publica en NuGet.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Si llega una subida nueva a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore Solution.sln

      # En Debug: algunos tests de ficheros y zip sólo se compilan en Debug (#if DEBUG).
      - name: Compilar
        run: dotnet build Solution.sln --no-restore -c Debug

      - name: Tests
        run: dotnet test Solution.sln --no-build -c Debug

  publish:
    # Sólo al crear una etiqueta vX.Y.Z, y sólo si los tests han pasado.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # necesario para Trusted Publishing: nuget.org da una clave temporal sin guardar ninguna aquí
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Comprobar que la etiqueta coincide con la versión del proyecto
        run: |
          etiqueta="${GITHUB_REF_NAME#v}"
          version=$(dotnet msbuild Kitpymes.Core.Shared/Kitpymes.Core.Shared.csproj -getProperty:Version -p:Configuration=Release -p:SolutionDir=$PWD/)
          if [ "$etiqueta" != "$version" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión del proyecto ($version). No se publica."
            exit 1
          fi

      - name: Empaquetar
        run: dotnet pack Solution.sln -c Release -o artifacts

      - name: Iniciar sesión en NuGet (clave temporal de 1 hora)
        uses: NuGet/login@v1
        id: login
        with:
          user: kitpymes

      - name: Publicar en NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
